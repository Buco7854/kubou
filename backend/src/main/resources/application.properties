# PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kubou}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kubou}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# IMPORTANT: Use a strong, environment-specific secret in production
app.jwt.secret=${APP_JWT_SECRET:a29a131f4a81a8c1e8b1a8c1e8b1a8c1e8b1a8c1e8b1a8c1e8b1a8c1e8b1a8c1}
# 24 hours
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# External API Configuration
quizapi.api-key=${QUIZAPI_KEY:your-api-key-here}
